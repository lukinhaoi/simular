name: Export question page previews

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/export-question-pages.yml"

permissions:
  contents: read

jobs:
  render-previews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PDF renderer
        run: python -m pip install --quiet pymupdf pillow
      - name: Render pending exam pages
        run: |
          python - <<'PY'
          import fitz, json, os
          from PIL import Image
          files = {
            "e2": "02-6-ano-ef-prova-paulista-3-bi-dia-1-pdf.pdf",
            "e3": "03-6-ano-ef-prova-paulista-3-bi-dia-2-pdf.pdf",
            "e5": "05-6-ano-ef-prova-paulista-dia-2-pdf.pdf",
            "e6": "06-2025-pp-2-bi-anos-finais-6-ano-2-dia-pdf.pdf",
            "e7": "07-lp_cie_6_aluno-pdf.pdf",
            "e10": "10-mt_geo_his_6_aluno-pdf.pdf",
            "e11": "11-mt_geo_his_6_aluno-1-pdf.pdf",
            "e21": "21-prova_e_folha_de_respostas_seduc_6_ano_dia_2__prova_laranja__3_bi-pdf.pdf",
            "e23": "23-prova_e_folha_de_respostas_seduc_6_ano_dia_2__prova_roxa__2_bi-1-pdf.pdf",
            "e24": "24-prova_e_folha_de_respostas_seduc_6_ano_dia_2__prova_roxa__3_bi-pdf.pdf",
            "e25": "25-prova_e_folha_de_respostas_seduc_6_ano_dia_2__prova_verde__3_bi-pdf.pdf",
          }
          os.makedirs("previews", exist_ok=True)
          index = {}
          for exam, filename in files.items():
              path = os.path.join("provas", filename)
              doc = fitz.open(path)
              outdir = os.path.join("previews", exam)
              os.makedirs(outdir, exist_ok=True)
              pages = []
              for i, page in enumerate(doc):
                  pix = page.get_pixmap(matrix=fitz.Matrix(1.45, 1.45), alpha=False)
                  image = Image.frombytes("RGB", [pix.width, pix.height], pix.samples)
                  name = f"page-{i+1:03d}.jpg"
                  image.save(os.path.join(outdir, name), "JPEG", quality=72, optimize=True)
                  pages.append({"page": i+1, "image": f"{exam}/{name}", "text": page.get_text("text")[:3500]})
              index[exam] = {"file": filename, "pages": pages}
          with open("previews/index.json", "w", encoding="utf-8") as f:
              json.dump(index, f, ensure_ascii=False)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: question-page-previews
          path: previews/
          retention-days: 1
